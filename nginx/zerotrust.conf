# /etc/nginx/sites-available/zerotrust  (la copia el script y reemplaza los marcadores)
server {
    listen 80;
    server_name __DOMAIN__;

    root /var/www/zerotrust;
    index index.html;
    server_tokens off;

    # ---- Encabezados de seguridad (para SecurityHeaders.com) ----
    # Importante: NO pongas add_header dentro de los "location", porque
    # nginx ignoraria estos y solo usaria los del location.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    # ---- API: se reenvia al backend por la IP PRIVADA (VPC Peering) ----
    location /api/ {
        proxy_pass http://__BACKEND_IP__:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Se sobrescribe (no se acumula) para que el cliente no pueda falsificar su IP
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
    }

    # ---- Frontend (React compilado) ----
    location / {
        try_files $uri /index.html;
    }
}
